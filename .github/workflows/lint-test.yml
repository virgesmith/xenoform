name: Lint and Test

on:
  push:
    branches: [ main ]
    tags: '**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.14t", "3.15"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v7
    - name: "Setup uv ${{ matrix.python-version }} / ${{ matrix.os }}"
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build
      run: uv sync --dev --all-extras
    - name: Lint
      run: |
        uv run ruff check
        uv run ty check
    # pyproject.toml makes a compiler warning in the tests' C++ an error. That's enforced with gcc only: clang and MSVC
    # warn differently by default (e.g. MSVC's size_t -> int C4267), so elsewhere warnings are reported but don't fail
    - name: Report, don't fail on, compiler warnings off Ubuntu
      if: matrix.os != 'ubuntu-latest'
      shell: bash
      run: echo "PYTEST_ADDOPTS=-W 'default:compiler warning'" >> "$GITHUB_ENV"
    # Coverage is enforced on exactly one job (3.14 / ubuntu-latest) so the cost is paid once,
    # and on a clean checkout (`ext/` is gitignored, so a fresh clone has no pre-built modules)
    # so every build/caching branch is exercised. Other jobs run plain pytest without coverage.
    - name: Test
      if: matrix.python-version != '3.14' || matrix.os != 'ubuntu-latest'
      run: uv run pytest -sv --no-cov
    - name: Test with coverage
      if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
      run: uv run pytest -sv --cov-fail-under=100
    - name: Run examples
      run: |
        uv run examples/loop.py
        uv run examples/distance_matrix.py
  # The single required status check, so matrix changes never need a ruleset edit. `always()` because GitHub
  # counts a skipped required check as passing, which would let a failed matrix merge.
  all-checks:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
    - run: test "${{ needs.build.result }}" = success
